services:
  backend:
    container_name: determino-backend

    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    ports:
      - "5000:5000"

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:17

    container_name: determino-postgres

    env_file:
      - .env.docker

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: